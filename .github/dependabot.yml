version: 2

# Why this file exists.
#
# Three CI runs in a row failed at restore on NU1109 "detected package downgrade" — a central
# pin sitting below what something else in the graph required. Every one of them was version
# drift discovered by a failed pipeline. That is the wrong notification mechanism: it costs a
# full round trip to learn something a bot can tell us in a pull request.
#
# Grouping matters as much as the schedule. The Microsoft 10.0 band has to move as one unit —
# EF Core, the Extensions primitives, ASP.NET Core components and the framework security pins
# all constrain each other, so eleven separate PRs would each be individually un-mergeable.
# One grouped PR per band is reviewable and restores cleanly.
#
# ── History: paused, now re-enabled ──────────────────────────────────────────────────────
#
# This file was added while main had never once restored successfully, and it immediately
# opened six pull requests. Every one ran full CI against a tree that did not build, so six red
# runs appeared that said nothing about the six proposed upgrades — they simply inherited
# main's failure. An upgrade bot needs a green baseline to compare a proposed change against;
# without one it emits noise. It was paused with `open-pull-requests-limit: 0`, which stops
# version-update PRs while leaving security-advisory PRs flowing.
#
# Restore, build, tests and the security scan now all pass on main, so the limits are back.
# A red Dependabot PR from here on means "this upgrade breaks us", which is the entire point.
#
# If CI ever goes red on main again for more than a day, set both limits back to 0 rather than
# letting the bot pile PRs on top of a broken baseline.

updates:
  - package-ecosystem: nuget
    # Dependabot reads Directory.Packages.props for central package management.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The whole .NET 10 band, moved together. This is the group that would have caught
      # the 10.0.0 → 10.0.11 gap.
      dotnet-10:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "System.Security.Cryptography.*"
        update-types:
          - minor
          - patch

      azure:
        patterns:
          - "Azure.*"
          - "Microsoft.Identity.*"
        update-types:
          - minor
          - patch

      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Shouldly"
          - "NetArchTest.*"
          - "coverlet.*"
        update-types:
          - minor
          - patch

    ignore:
      # Major bumps are deliberate, reviewed changes — not something to merge from a bot on a
      # Monday. Microsoft.Identity.Web 3.x → 4.x in particular is a decision with an auth
      # regression surface, and it is tracked separately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # The nuget block below has the same rule; this one was missing it, which is why the
      # first Dependabot batch proposed actions/setup-dotnet v5 → v6. A major action bump can
      # change the runtime it executes on and how it reads global.json — worth taking, but as
      # a deliberate change with a run behind it, not as an automatic Monday PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
