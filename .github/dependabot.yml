version: 2

# Why this file exists.
#
# Three CI runs in a row failed at restore on NU1109 "detected package downgrade" — a central
# pin sitting below what something else in the graph required. Every one of them was version
# drift discovered by a failed pipeline. That is the wrong notification mechanism: it costs a
# full round trip to learn something a bot can tell us in a pull request.
#
# Grouping matters as much as the schedule. The Microsoft 10.0 band has to move as one unit —
# EF Core, the Extensions primitives, ASP.NET Core components and the framework security pins
# all constrain each other, so eleven separate PRs would each be individually un-mergeable.
# One grouped PR per band is reviewable and restores cleanly.

updates:
  - package-ecosystem: nuget
    # Dependabot reads Directory.Packages.props for central package management.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The whole .NET 10 band, moved together. This is the group that would have caught
      # the 10.0.0 → 10.0.11 gap.
      dotnet-10:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "System.Security.Cryptography.*"
        update-types:
          - minor
          - patch

      azure:
        patterns:
          - "Azure.*"
          - "Microsoft.Identity.*"
        update-types:
          - minor
          - patch

      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Shouldly"
          - "NetArchTest.*"
          - "coverlet.*"
        update-types:
          - minor
          - patch

    ignore:
      # Major bumps are deliberate, reviewed changes — not something to merge from a bot on a
      # Monday. Microsoft.Identity.Web 3.x → 4.x in particular is a decision with an auth
      # regression surface, and it is tracked separately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
