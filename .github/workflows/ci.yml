name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # One place for the results directory, used by both the test step and the upload step.
  # These drifting apart is why the first run reported "no files found under ./TestResults".
  TEST_RESULTS_DIR: ${{ github.workspace }}/TestResults

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # NOTE: the SQL Server service container has been removed for now. The only test
    # projects in the solution today — Domain.UnitTests and Architecture.Tests — touch no
    # database, so it was spending ~33 s of every run initialising a container nothing
    # consumed, and adding a health-check flake to a pipeline we are trying to stabilise.
    #
    # Restore it verbatim when FcTelecom.Integration.Tests lands (it is in the backlog as
    # N-05). Integration tests must run against real SQL Server: an in-memory provider
    # proves nothing about decimal precision, filtered indexes, or collation, and all three
    # matter in this schema.
    #
    # services:
    #   sql:
    #     image: mcr.microsoft.com/mssql/server:2022-latest
    #     env:
    #       ACCEPT_EULA: "Y"
    #       MSSQL_SA_PASSWORD: "CiPipeline!Passw0rd"
    #       MSSQL_PID: Developer
    #     ports: ["1433:1433"]
    #     options: >-
    #       --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiPipeline!Passw0rd' -C -Q 'SELECT 1'"
    #       --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors, set in Directory.Build.props. A warning nobody has time to
        # read is the same as no warning at all.
        run: dotnet build --no-restore --configuration Release

      - name: Survey every remaining diagnostic
        # Runs ONLY when the gating build above failed, and never gates anything itself.
        #
        # The problem it solves: the solution builds in dependency order, so when Domain fails
        # analysis, Application, Infrastructure, Web and the test projects are never compiled
        # and never analysed. Their diagnostics stay invisible until Domain is clean, which
        # turns "fix the analyzer findings" into one CI round trip per project.
        #
        # This step rebuilds with -p:TreatWarningsAsErrors=false so every project compiles and
        # reports, then prints the full deduplicated list. One run, the whole picture.
        #
        # To be explicit, because it looks like the thing we were told not to do: the committed
        # TreatWarningsAsErrors in Directory.Build.props is untouched and still true, and the
        # gating Build step above still fails the job. The override lives only in this
        # diagnostic step's command line and gates nothing.
        #
        # --no-incremental because the failed build left partial outputs; without it MSBuild
        # can consider a project up to date and skip re-running its analyzers.
        if: failure()
        continue-on-error: true
        run: |
          dotnet build --no-restore --no-incremental --configuration Release \
            -p:TreatWarningsAsErrors=false \
            > survey.txt 2>&1 || true

          echo "### Analyzer diagnostics across the whole solution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # MSBuild prints each diagnostic inline and again in the summary; dedupe on the
          # file:line:code triple so the count reflects distinct findings.
          grep -oE '[^ ]+\.(cs|razor)\([0-9]+,[0-9]+\): (warning|error) [A-Z]+[0-9]+: .*' survey.txt \
            | sed 's| \[/home/runner/work.*||' \
            | sort -u > findings.txt || true

          if [ ! -s findings.txt ]; then
            echo "No analyzer diagnostics found. The gating build failed for another reason —" >> "$GITHUB_STEP_SUMMARY"
            echo "read the Build step log directly." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "**$(wc -l < findings.txt) distinct diagnostic(s).** By rule:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -oE '(warning|error) [A-Z]+[0-9]+' findings.txt \
            | awk '{print $2}' | sort | uniq -c | sort -rn >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>All findings</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat findings.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          echo "=== Distinct diagnostics ==="
          cat findings.txt

      - name: Upload diagnostic survey
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-survey
          path: |
            survey.txt
            findings.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Run tests
        # No ConnectionStrings__Default here: no current test project touches a database.
        # Restore it alongside the SQL service container when integration tests land — a
        # connection string pointing at a container that does not exist is worse than none,
        # because it makes a missing dependency look configured.
        #
        # `--logger trx` without a fixed LogFileName. With `LogFileName=results.trx`, every
        # test project in the solution writes to the same path and the last one to finish
        # silently overwrites the rest — so a green run would report a fraction of the tests
        # it actually executed. Letting the logger name the file per assembly avoids that.
        run: >-
          dotnet test --no-build --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory "${{ env.TEST_RESULTS_DIR }}"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          # `ignore` rather than `warn`: when an earlier step fails, tests never run and
          # there is genuinely nothing to upload. A warning there is noise that trains
          # people to skim past the annotations that do matter.
          if-no-files-found: ignore
          retention-days: 14

  code-style:
    # Advisory, not blocking — deliberately a separate job so a whitespace difference can
    # never mask a real build or test failure.
    #
    # continue-on-error is on the FORMATTING STEP, not on the job. Job-level
    # continue-on-error still renders the job with a red X in the Actions UI and still
    # reports as a failed check, so an intentionally-advisory job looked identical to a
    # broken one — the last run was reported as "three failures" partly because of this.
    # A job that is permanently red teaches people to ignore red.
    #
    # At step level the job finishes green and the formatting difference surfaces as a
    # warning annotation instead. Restore and setup are still hard failures here: a restore
    # break is a real break, and it should not hide behind the formatting exemption.
    #
    # TODO: once `dotnet format` has been run over the codebase and committed, drop the
    # continue-on-error and make this blocking. It is advisory only because the codebase has
    # not yet been formatted by the tool, not because formatting does not matter.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        id: format
        continue-on-error: true
        run: dotnet format --verify-no-changes --no-restore

      - name: Report formatting differences
        if: steps.format.outcome == 'failure'
        run: |
          echo "::warning title=Formatting::dotnet format reports differences. Advisory for now — run 'dotnet format' locally and commit the result. See the code-style job log for the file list."

  security-scan:
    runs-on: ubuntu-latest

    # Job-level permissions REPLACE the workflow-level block above rather than adding to it,
    # so everything this job needs has to be listed here.
    #
    # actions: read is the one that is easy to miss. CodeQL's analyze step builds a diff range
    # for diff-informed analysis, which calls GET /repos/{owner}/{repo}/actions/runs/{run_id},
    # and that endpoint requires the Actions read permission. Without it the scan itself
    # succeeds — it reported "CodeQL scanned 60 out of 60 C# files" and wrote the SARIF — and
    # then the job fails at the reporting step with "Resource not accessible by integration".
    # A failure after the work is done, for a reason unrelated to the code, is the kind of red
    # run that teaches people to ignore red.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # NuGet Audit runs during restore and raises NU1901-NU1904 for known advisories.
      # Because TreatWarningsAsErrors is on, a high or critical advisory fails restore here
      # before this job ever reaches the explicit scan below. That is intended: the scan is
      # the belt, restore is the braces.
      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "(High|Critical)" vulnerable.txt; then
            echo "::error::Vulnerable packages found at High or Critical severity."
            echo "Fix by pinning a patched version in Directory.Packages.props."
            echo "Use 'dotnet nuget why <project> <package>' to find what pulls it in."
            exit 1
          fi
          echo "No High or Critical advisories against the resolved dependency graph."

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build for analysis
        run: dotnet build --no-restore --configuration Release

      - name: Run CodeQL
        uses: github/codeql-action/analyze@v4

  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "Bicep templates compile."
