# Local development dependencies.
#
# There is deliberately no SQLite "quick start" option. EF Core provider drift between
# SQLite and SQL Server silently changes behaviour around decimal precision, computed
# columns, filtered indexes, and collation — and every one of those matters in this
# schema. A container is a cheaper dependency than a class of bugs that only appears
# in production.
#
#   docker compose up -d
#   dotnet ef database update -p src/FcTelecom.Infrastructure -s src/FcTelecom.Web

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fctelecom-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "11433:1433"
    volumes:
      - fctelecom-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Azurite emulates Blob and Queue storage so document upload and the outbox work
  # locally without an Azure subscription.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: fctelecom-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - fctelecom-azurite-data:/data

volumes:
  fctelecom-sql-data:
  fctelecom-azurite-data:
